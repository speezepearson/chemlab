# Publishes main to the root of GitHub Pages, leaving PR previews in place.
name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
