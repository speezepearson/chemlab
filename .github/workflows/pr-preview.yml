# Builds each PR and publishes it to GitHub Pages at /pr-preview/pr-<N>/,
# with a sticky comment on the PR linking to it. The preview is removed
# when the PR closes.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm test
          npm run build

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
